<!DOCTYPE html>
<html lang="en">
    
<head>

		<!-- Meta Tags -->
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="AvocadoPOS is a powerful Bootstrap based Inventory Management Admin Template designed for businesses, offering seamless invoicing, project tracking, and estimates.">
		<meta name="keywords" content="inventory management, admin dashboard, bootstrap template, invoicing, estimates, business management, responsive admin, POS system">
		<meta name="author" content="AvocadoPOS">
		<meta name="robots" content="index, follow">
		<title>AvocadoPOS - Inventory Management & Admin Dashboard Template</title>

		<!-- Favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">

		<!-- Apple Touch Icon -->
		<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
		
		<!-- Bootstrap CSS -->
        <link rel="stylesheet" href="assets/css/bootstrap.min.css">
		
        <!-- Fontawesome CSS -->
		<link rel="stylesheet" href="assets/plugins/fontawesome/css/fontawesome.min.css">
		<link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css">

        <!-- Tabler Icon CSS -->
	    <link rel="stylesheet" href="assets/plugins/tabler-icons/tabler-icons.min.css">

	    <!-- Main CSS -->
        <link rel="stylesheet" href="assets/css/style.css">
		
    </head>
    <body class="account-page">

        <div id="global-loader" >
			<div class="whirly-loader"> </div>
		</div>

		<!-- Main Wrapper -->
        <div class="main-wrapper">
			<div class="account-content">
				<div class="login-wrapper bg-img">
                    <div class="login-content authent-content">
                        <form action="index.html">
                            <div class="login-userset">
                                <div class="login-logo logo-normal">
                                   <img src="assets/img/logo.svg" alt="img">
                               </div>
                               <a href="index.html" class="login-logo logo-white">
                                   <img src="assets/img/logo-white.svg"  alt="Img">
                               </a>
                                <div class="login-userheading">
                                    <h3>Sign In</h3>
                                    <h4 class="fs-16">Access Avocado Inventory panel using your email and password.</h4>
                                </div>
                                <div class="mb-3 p-3 bg-light rounded border">
                                    <label class="form-label fw-bold text-dark fs-13 mb-2"><i class="ti ti-key me-1 text-success"></i> Quick Select Login Account:</label>
                                    <div class="d-flex flex-wrap gap-1">
                                        <button type="button" class="btn btn-sm btn-outline-danger demo-login-btn" data-email="admin@avocado.com" data-pass="admin123">👑 Super Admin</button>
                                        <button type="button" class="btn btn-sm btn-outline-success demo-login-btn" data-email="freshmart.admin@avocado.com" data-pass="admin123">🛡️ Org Admin</button>
                                        <button type="button" class="btn btn-sm btn-outline-info demo-login-btn" data-email="freshmart.manager@avocado.com" data-pass="manager123">👔 Manager</button>
                                        <button type="button" class="btn btn-sm btn-outline-secondary demo-login-btn" data-email="freshmart.staff@avocado.com" data-pass="staff123">📦 Staff</button>
                                    </div>
                                </div>
                                 <div class="mb-3">
                                     <label class="form-label">Email <span class="text-danger"> *</span></label>
                                     <div class="input-group">
                                         <input type="email" id="login-email-input" value="admin@avocado.com" class="form-control border-end-0" required>
                                         <span class="input-group-text border-start-0">
                                             <i class="ti ti-mail"></i>
                                         </span>
                                     </div>
                                 </div>
                                 <div class="mb-3">
                                     <label class="form-label">Password <span class="text-danger"> *</span></label>
                                     <div class="pass-group">
                                         <input type="password" id="login-password-input" value="admin123" class="pass-input form-control" required>
                                         <span class="ti toggle-password ti-eye-off text-gray-9"></span>
                                     </div>
                                 </div>
                                <div class="form-login authentication-check">
                                    <div class="row">
                                        <div class="col-12 d-flex align-items-center justify-content-between">
                                            <div class="custom-control custom-checkbox">
                                                <label class="checkboxs ps-4 mb-0 pb-0 line-height-1 fs-16 text-gray-6">
                                                    <input type="checkbox" class="form-control">
                                                    <span class="checkmarks"></span>Remember me
                                                </label>
                                            </div>
                                            <div class="text-end">
                                                <a class="text-orange fs-16 fw-medium" href="forgot-password.html">Forgot Password?</a>
                                            </div>
                                        </div>                                    
                                    </div>
                                </div>
                                <div class="form-login">
                                    <button type="submit" id="login-submit-btn" class="btn btn-primary w-100">Sign In</button>
                                </div>
                                <div class="signinform">
                                    <h4>New on our platform?<a href="register.html" class="hover-a"> Create an account</a></h4>
                                </div>
                                <div class="form-setlogin or-text">
                                    <h4>OR</h4>
                                </div>
                                <div class="mt-2">
                                    <div class="d-flex align-items-center justify-content-center flex-wrap">
                                        <div class="text-center me-2 flex-fill">
                                            <a href="javascript:void(0);"
                                                class="br-10 p-2 btn btn-info d-flex align-items-center justify-content-center">
                                                <img class="img-fluid m-1" src="assets/img/icons/facebook-logo.svg" alt="Facebook">
                                            </a>
                                        </div>
                                        <div class="text-center me-2 flex-fill">
                                            <a href="javascript:void(0);"
                                                class="btn btn-white br-10 p-2  border d-flex align-items-center justify-content-center">
                                                <img class="img-fluid m-1" src="assets/img/icons/google-logo.svg" alt="Facebook">
                                            </a>
                                        </div>
                                        <div class="text-center flex-fill">
                                            <a href="javascript:void(0);"
                                                class="bg-dark br-10 p-2 btn btn-dark d-flex align-items-center justify-content-center">
                                                <img class="img-fluid m-1" src="assets/img/icons/apple-logo.svg" alt="Apple">
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
                                 <p>Copyright &copy; 2026 AvocadoPOS</p>
                             </div>
                            </div>
                        </form>
                    </div>
                </div>
			</div>
        </div>
		<!-- /Main Wrapper -->
		  
		

         <!-- Feather Icon JS -->
		<script src="assets/js/feather.min.js"></script>
		
		<!-- Bootstrap Core JS -->
        <script src="assets/js/bootstrap.bundle.min.js"></script>
		
		<!-- Custom JS -->
        <script src="assets/js/script.js"></script>
        <script src="assets/js/api.js"></script>

    </body>

</html>
